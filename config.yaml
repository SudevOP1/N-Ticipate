# N-Ticipate configuration
#
# Every tunable parameter for every phase lives here, so no phase ever
# hardcodes a magic number. Read via nticipate.config.load_config().
# Paths are relative to the project root unless absolute.

project:
  name: N-Ticipate
  version: 0.1.0

paths:
  data_raw: data/raw
  data_processed: data/processed
  models: data/models
  user_profile: data/models/user_profile.json
  report: report

# ---------------------------------------------------------------- Phase 1
preprocessing:
  # Language modelling keeps stopwords and punctuation on purpose:
  # "of the" is exactly what a bigram model needs to predict.
  remove_stopwords: false
  remove_punctuation: false

  lowercase_for_counts: true # count case-insensitively ...
  truecase_output: true # ... then restore natural casing on suggestion

  tokenizer: nltk # nltk | regex  (regex works with no corpora downloaded)
  sentence_splitter: punkt # punkt | regex

  min_token_freq: 3 # tokens rarer than this become <UNK>. Raised from 2
  # with the move off Brown: on a 6M-token web corpus the hapax tail is
  # mostly typos and scrape debris, and every one of them was a candidate
  # the trie could offer.
  max_vocab_size: 80000 # 0 = unlimited. Brown only had 56k types; the
  # modern corpus has more real vocabulary worth keeping.
  unk_token: "<UNK>"
  bos_token: "<s>"
  eos_token: "</s>"

  min_sentence_tokens: 2 # drop shorter sentences from training
  strip_urls: true
  strip_emails: true
  normalize_unicode: NFC # also handles Devanagari for Phase 5

  split:
    train: 0.8
    dev: 0.1
    test: 0.1
    seed: 42

# ---------------------------------------------------------------- Phase 2
ngram:
  max_order: 3 # 1 = unigram, 2 = bigram, 3 = trigram
  # mle | laplace | stupid_backoff | kneser_ney
  smoothing: stupid_backoff
  laplace_k: 1.0 # add-k value when smoothing == laplace
  backoff_alpha: 0.4 # stupid-backoff discount per level dropped
  kneser_ney_discount: 0.75

  pruning:
    enabled: true
    min_count: 2 # drop n-grams seen fewer times
    max_continuations: 50 # cap successors stored per context

  corpus:
    # Was `brown`. Brown is 1961 edited American prose, 1.1M tokens: the
    # register is wrong for a typing assistant and the trigram table is
    # too sparse to cover what a user actually types. Rebuilt by
    # scripts/fetch_data.py from HuggingFaceFW/fineweb-edu (modern web
    # prose) plus knkarthick/dialogsum (messenger-style dialogue).
    english: data/raw/modern_english.txt
    fallback_file: data/raw/sample_english.txt

# ---------------------------------------------------------------- Phase 3
prediction:
  max_suggestions: 3
  min_prefix_len: 1 # keystrokes before completion mode fires
  candidate_pool: 50 # candidates generated before reranking
  score_floor: -30.0 # log-prob floor, avoids -inf in ranking

  # Punctuation is kept in the language model on purpose (it predicts well),
  # but as a *suggestion* "." is useless -- the user can type it faster than
  # they can read it. Off by default so the Phase 3 metrics measure the model
  # itself; Phase 7 turns it on for display.
  suggest_punctuation: true

  personalization:
    enabled: true
    lambda_max: 0.4 # ceiling on the user-model interpolation weight
    lambda_growth_tokens: 5000 # tokens of user text to reach lambda_max
    max_user_tokens: 200000 # ring-buffer cap on stored user text
    # The user's own vocabulary is deliberately never <UNK>-ed:
    # capturing names and jargon is the whole point.

  latency:
    debounce_ms: 50
    p95_budget_ms: 50

# ------------------------------------------------------------- Phases 4-5
hmm:
  language: english # english | hindi   (same HMMTagger class for both)
  tagset: universal # universal | penn
  # Laplace on transition + emission matrices. NOT 1.0: add-one puts more mass
  # on the smoothing term than on the counts at this vocabulary size and drops
  # the tagger below the most-frequent-tag baseline. Swept in notebook 04;
  # 0.01 is on the plateau.
  smoothing_k: 0.01
  use_log_space: true # log-space Viterbi, guards underflow
  unknown_word_strategy: suffix # suffix | uniform | most_frequent_tag
  unknown_prior: hapax # hapax | laplace -- P(tag | unseen word) estimated
  # from the words seen exactly once

  cross_check_with_nltk: false # NLTK HMM used as a correctness check only,
  # never in the shipped prediction path

  corpora:
    english: data/raw/ud_english.conll
    hindi: data/raw/ud_hindi.conll
    # Empty on purpose. load_tagged_sentences() prefers the NLTK corpus
    # when this is set, which would silently override the UD files above.
    # NLTK treebank is WSJ newswire and NLTK `indian` is ~10k Hindi
    # tokens; UD English-EWT/GUM is web text (the domain the app runs in)
    # and UD Hindi-HDTB is ~280k tokens.
    english_nltk: ""
    hindi_nltk: ""

  split:
    train: 0.8
    test: 0.2
    seed: 42

# ---------------------------------------------------------------- Phase 6
reranking:
  enabled: true
  # Weight on the POS term. alpha = 0 must reproduce the Phase 3 ranking
  # exactly. Swept in notebook 06 on 400 held-out Brown sentences: hit@1 rises
  # to a plateau over 0.1-0.3 and falls away past 0.5, but hit@5 decays
  # monotonically from the start -- a heavy tag prior promotes grammatical
  # words the language model had good reason to rank low. 0.1 is the corner:
  # it takes the whole hit@1 gain (+1.1 points) while leaving hit@3 and hit@5
  # where Phase 3 left them.
  alpha: 0.1
  # How many preceding *tokens* are decoded to get the conditioning tag -- not
  # how many tags condition it. The HMM is a tag bigram, so the term is always
  # P(tag | one preceding tag); this window only decides how much left context
  # Viterbi sees when it picks that tag. Measured in notebook 06: a 2-token
  # window picks a different tag from a full-buffer decode on 1.3% of
  # positions, a 3-token window on 0.1%.
  #
  # Raising it past 2 changes nothing in the running app, though: predict()
  # has already trimmed the context to the trigram model's two words, and the
  # Phase 7 capture buffer (app.capture.max_context_words) holds two. 2 is
  # therefore both the setting and the ceiling.
  tag_context_size: 2
  # Flat handicap on a candidate whose tag came from the suffix heuristic
  # rather than from having been seen in the tagged corpus. Those guesses are
  # wrong often enough that the POS term should not carry full weight, but the
  # word is usually a real word, so this is a handicap, not a veto.
  unknown_tag_penalty: -2.0

# ---------------------------------------------------------------- Phase 7
app:
  enabled_on_start: true
  language: english # which HMM tagger reranks; the n-gram model is English

  # Artefacts the app loads at start-up. Only the n-gram model is required --
  # with no tagger the predictor is exactly Phase 3, which is a working app.
  # The truecase map is what lets the overlay show "India" rather than the
  # lowercased form the counts are kept in. It ships on its own (a few MB)
  # because the corpus it came from is 77 MB of sentences the app never reads:
  # parsing those cost ~2.4 s of start-up and, with the n-gram model already
  # resident, enough memory to raise MemoryError. `corpus` stays as the
  # fallback for a checkout where retrain.py has not written the small file.
  models:
    ngram: data/models/ngram_trigram_pruned.pkl
    truecase: data/models/truecase.json
    corpus: data/processed/modern.json
    tagger: data/models/hmm_english.pkl
    tagger_hindi: data/models/hmm_hindi.pkl

  hotkeys:
    accept: tab
    # Stop the accept key itself from reaching the application once it has
    # been used to take a suggestion -- otherwise accepting types the word and
    # then a Tab, which indents the line or moves focus out of the field.
    # Windows-only: it works by suppressing the key inside the low-level hook,
    # and it never fires unless the overlay is up, so a plain Tab is untouched.
    suppress_accept: true
    dismiss: esc
    toggle: "<ctrl>+<alt>+n"

  overlay:
    max_items: 3
    font_size: 11
    offset_x: 4
    offset_y: 20
    theme: dark # dark | light

  capture:
    context_reset_keys: [enter, tab, escape]
    max_context_words: 2 # trigram model needs only the last two
    injection_method: type # type | clipboard
    append_space: true # a suggestion is a finished word; the space follows
    # The buffer is cleared at every sentence end, so this cap is only reached
    # by a very long sentence. It exists so a runaway paste or a document with
    # no punctuation cannot grow the one object that holds what the user typed.
    max_buffer_chars: 200
    # Devanagari does not use the full stop, and Phase 5's model is trained on
    # sentences that end with a danda -- so both are boundaries here.
    sentence_end_chars: ".!?।॥"

  # The personalization layer from Phase 3 improves with use, but it improves
  # by storing what the user wrote. That is compatible with the privacy rules
  # below only if it is deliberate, so it stays off until the user turns on
  # "Learn from my typing" in the tray menu. What gets saved is the profile's
  # n-gram counts, never the keystroke stream.
  learning:
    enabled: false
    autosave_every: 200 # tokens learned between profile saves

  privacy:
    # Hard requirements, not preferences. Nothing leaves the machine.
    disable_in_password_fields: true
    log_keystrokes_to_disk: false
    telemetry: false

# ---------------------------------------------------------------- Phase 8
evaluation:
  hit_at_k: [1, 3, 5]
  latency_percentiles: [50, 95]
  report_file: report/notes.md

logging:
  level: INFO
  file: "" # empty = console only
